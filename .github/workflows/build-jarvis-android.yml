name: Build JARVIS Android test

on:
  push:
    branches:
      - jarvis-personal-fr-v1
  workflow_dispatch:

# Serialize test builds so the first run creates the signing key and every
# following run restores exactly the same key from cache.
concurrency:
  group: jarvis-android-debug-signing-v2
  cancel-in-progress: false

jobs:
  android-test:
    name: JARVIS Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-android-debug-keystore-v2

      - name: Create signing key once when cache is empty
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=JARVIS Debug,O=Personal,C=FR"
          fi
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | grep -E "SHA256:|Alias name:|Valid from:"

      - name: Install Capacitor toolchain
        run: npm install --ignore-workspace --no-audit --no-fund

      - name: Sync packaged local web app
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/JARVIS-test.apk
          ls -lh dist/JARVIS-test.apk

      - name: Show APK signing fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/JARVIS-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-test
          path: dist/JARVIS-test.apk
          if-no-files-found: error
