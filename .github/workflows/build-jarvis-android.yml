name: Build JARVIS Android test

on:
  push:
    branches:
      - jarvis-personal-fr-v1
  workflow_dispatch:

jobs:
  android-test:
    name: JARVIS Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-android-debug-keystore-v1

      - name: Install Capacitor toolchain
        run: npm install --ignore-workspace --no-audit --no-fund

      - name: Sync packaged local web app
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/JARVIS-test.apk
          ls -lh dist/JARVIS-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-test
          path: dist/JARVIS-test.apk
          if-no-files-found: error
